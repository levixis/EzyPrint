<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1">
  <meta name="description"
    content="EzyPrint - Upload your documents, pay securely, and pick up from your nearest print shop. Simple, fast, and hassle-free printing solutions.">
  <meta name="theme-color" content="#0F172A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/png" href="/favicon.png">
  <title>EzyPrint - Modern Printing Solutions</title>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <!--
    Loaded here rather than on demand so `window.google` exists before anyone
    clicks Sign in with Google.

    Loading it inside the click handler meant requestAccessToken() ran from the
    script's `load` event, which is not a user-gesture context. Chrome allows
    the popup anyway; Firefox and Safari block it, so the first sign-in attempt
    failed with "Failed to open popup window". The id matches what
    signInWithGoogle looks for, so it reuses this tag instead of injecting a
    second one.
  -->
  <script id="google-gsi-script" src="https://accounts.google.com/gsi/client" async></script>
  <meta name="mobile-web-app-capable" content="yes">
</head>

<body class="bg-brand-bg font-sans text-brand-text">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
